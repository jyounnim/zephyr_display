sample:
  description: Scan I2C0 for connected devices once at boot, from a dedicated thread
  name: i2c_bus_scanner
common:
  tags:
    - i2c
tests:
  sample.i2c.bus_scanner:
    platform_allow:
      - sr100_rdk/sr100/m55
    harness: console
    harness_config:
      type: one_line
      regex:
        - "=== I2C Bus Scanner \\(SR110\\) ==="
